name: test-guard

# Signal précoce sur chaque push : typecheck + garde différentielle des tests.
# NOTE : ce workflow ne bloque PAS la publication Lovable (voir README de
# scripts/test-guard). Il donne le signal sur GitHub, avant toute publication.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Le même verrou de dépendances que le build Lovable, sans résolution
      # de nouvelles versions à chaque passage de la CI.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Installer ripgrep pour les gardes de contenu
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep


      - name: Typecheck
        run: npx tsc -b

      - name: Garde différentielle des tests
        run: npm run test:guard

      - name: Cycle d'invalidation SEO des profils (Postgres local)
        run: npm run test:sql:profile-seo

      - name: Consommateur SEO unique (Postgres local)
        run: npm run test:sql:cache-consumer
