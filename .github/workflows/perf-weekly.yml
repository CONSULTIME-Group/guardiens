name: perf-weekly

# Lot perf 1 (14/10/2026) : sonde de laboratoire chaque lundi (06 h 10, heure
# de Paris en été). Trois passages par adresse sur un téléphone simulé ;
# échec si une médiane dépasse scripts/perf/budgets.json, GitHub prévient
# alors par email. Les machines sont aux États-Unis : lecture relative.

on:
  schedule:
    - cron: "10 4 * * 1"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Mesurer
        run: |
          set -o pipefail
          node scripts/perf/measure-listings.mjs --runs 3 --with-first-fiche --budget scripts/perf/budgets.json \
            "https://guardiens.fr/annonces" \
            "https://guardiens.fr/annonces?ville=Lyon&zone=radius" \
            | tee perf-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: perf-report.json
